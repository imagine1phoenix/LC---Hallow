<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1834"/>
      <stop offset="70%" stop-color="#0e0c18"/>
      <stop offset="100%" stop-color="#07060a"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Dark Background Seal with Gold Bezel -->
  <circle cx="50" cy="50" r="47" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="41" fill="none" stroke="#d4af37" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.65"/>

  <!-- Gothic Raven Wings -->
  <path d="M50 20 C42 32, 25 38, 20 54 C30 52, 38 56, 45 68 C47 55, 42 42, 50 32 C58 42, 53 55, 55 68 C62 56, 70 52, 80 54 C75 38, 58 32, 50 20 Z" fill="url(#goldGrad)" filter="url(#shadow)"/>

  <!-- Central Quill / Key -->
  <polygon points="50,25 53.5,41 50,78 46.5,41" fill="#f5ede0" filter="url(#shadow)"/>

  <!-- Crown Star (Crimson Ruby) -->
  <polygon points="50,13 52,17 56,17 53,20 54,24 50,22 46,24 47,20 44,17 48,17" fill="url(#rubyGrad)"/>
</svg>
